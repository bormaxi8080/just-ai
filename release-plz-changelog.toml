# git-cliff configuration consumed by release-plz.
# https://release-plz.dev/docs/config#the-changelog_config-field
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}
- {{ commit.message }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/bormaxi8080/just-ai/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
# Preserve non-conventional commits rather than silently dropping them.
conventional_commits = false
filter_unconventional = false
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^(Release|release|chore: release|ci: release)", skip = true },
  { message = "^feat", group = "<!-- 01 -->🚀 Features" },
  { message = "^fix", group = "<!-- 02 -->🐛 Bug Fixes" },
  { message = "^docs", group = "<!-- 03 -->📝 Documentation" },
  { message = "^style", group = "<!-- 04 -->💄 Style" },
  { message = "^refactor", group = "<!-- 05 -->♻️ Refactoring" },
  { message = "^perf", group = "<!-- 06 -->⚡ Performance" },
  { message = "^test", group = "<!-- 07 -->✅ Tests" },
  { message = "^chore", group = "<!-- 08 -->🔧 Chores" },
  { message = "^build", group = "<!-- 09 -->🏗️ Build System" },
  { message = "^ci", group = "<!-- 10 -->🔀 CI/CD" },
  { message = ".*", group = "<!-- 11 -->Other" },
]
