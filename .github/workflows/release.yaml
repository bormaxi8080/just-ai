name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: --deny warnings
  REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}

jobs:
  prerelease:
    runs-on: ubuntu-latest

    outputs:
      value: ${{ steps.prerelease.outputs.value }}

    steps:
    - name: Prerelease Check
      id: prerelease
      run: |
        if [[ ${{ github.ref_name }} =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo value=false >> $GITHUB_OUTPUT
        else
            echo value=true >> $GITHUB_OUTPUT
        fi

  # Build binaries for all platforms (reuses the package script logic)
  package:
    strategy:
      matrix:
        target:
        - aarch64-apple-darwin
        - aarch64-pc-windows-msvc
        - aarch64-unknown-linux-musl
        - arm-unknown-linux-musleabihf
        - armv7-unknown-linux-musleabihf
        - loongarch64-unknown-linux-musl
        - riscv64gc-unknown-linux-musl
        - x86_64-apple-darwin
        - x86_64-pc-windows-msvc
        - x86_64-unknown-linux-musl
        include:
        - target: aarch64-apple-darwin
          os: macos-latest
          target_rustflags: ''
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          target_rustflags: ''
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          target_rustflags: '--codegen linker=aarch64-linux-gnu-gcc'
        - target: arm-unknown-linux-musleabihf
          os: ubuntu-latest
          target_rustflags: '--codegen linker=arm-linux-gnueabihf-gcc'
        - target: armv7-unknown-linux-musleabihf
          os: ubuntu-latest
          target_rustflags: '--codegen linker=arm-linux-gnueabihf-gcc'
        - target: loongarch64-unknown-linux-musl
          os: ubuntu-latest
          target_rustflags: '--codegen linker=loongarch64-linux-gnu-gcc-14'
        - target: riscv64gc-unknown-linux-musl
          os: ubuntu-latest
          target_rustflags: '--codegen linker=riscv64-linux-gnu-gcc'
        - target: x86_64-apple-darwin
          os: macos-latest
          target_rustflags: ''
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          target_rustflags: ''

    runs-on: ${{matrix.os}}

    needs:
    - prerelease

    steps:
    - uses: actions/checkout@v4

    - name: Install Target Dependencies
      run: |
        case ${{ matrix.target }} in
          aarch64-pc-windows-msvc)
            rustup target add aarch64-pc-windows-msvc
            ;;
          aarch64-unknown-linux-musl)
            sudo apt-get update
            sudo apt-get install gcc-aarch64-linux-gnu libc6-dev-i386
            ;;
          arm-unknown-linux-musleabihf|armv7-unknown-linux-musleabihf)
            sudo apt-get update
            sudo apt-get install gcc-arm-linux-gnueabihf
            ;;
          loongarch64-unknown-linux-musl)
            sudo apt-get update
            sudo apt-get install gcc-14-loongarch64-linux-gnu
            ;;
          riscv64gc-unknown-linux-musl)
            sudo apt-get update
            sudo apt-get install gcc-riscv64-linux-gnu
            ;;
        esac

    - name: Build CLI
      run: cargo build --release --package just-ai --target ${{ matrix.target }}

    - name: Build MCP
      run: cargo build --release --manifest-path apps/just-ai-mcp/Cargo.toml --target ${{ matrix.target }}

    - name: Package CLI
      id: package-cli
      run: |
       mkdir -p dist
        TARGET=${{ matrix.target }}
        VERSION=${{ github.ref_name }}
        BINARY=target/${TARGET}/release/just-ai
        [[ "$TARGET" == *windows* ]] && BINARY="${BINARY}.exe"
        ARCHIVE="just-ai-${VERSION}-${TARGET}.tar.gz"
        tar czf "dist/${ARCHIVE}" -C target/${TARGET}/release just-ai*
        echo "archive=dist/${ARCHIVE}" >> $GITHUB_OUTPUT

    - name: Package MCP
      id: package-mcp
      run: |
        mkdir -p dist
        TARGET=${{ matrix.target }}
        VERSION=${{ github.ref_name }}
        BINARY=apps/just-ai-mcp/target/${TARGET}/release/just-ai-mcp
        [[ "$TARGET" == *windows* ]] && BINARY="${BINARY}.exe"
        ARCHIVE="just-ai-mcp-${VERSION}-${TARGET}.tar.gz"
        tar czf "dist/${ARCHIVE}" -C apps/just-ai-mcp/target/${TARGET}/release just-ai-mcp*
        echo "archive=dist/${ARCHIVE}" >> $GITHUB_OUTPUT

    - name: Upload CLI Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: just-ai-${{ matrix.target }}
        path: ${{ steps.package-cli.outputs.archive }}

    - name: Upload MCP Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: just-ai-mcp-${{ matrix.target }}
        path: ${{ steps.package-mcp.outputs.archive }}

    - name: Upload for Checksums
      if: >-
        matrix.target == 'aarch64-unknown-linux-musl'
        || matrix.target == 'x86_64-unknown-linux-musl'
      uses: actions/upload-artifact@v4
      with:
        name: checksum-${{ matrix.target }}
        path: dist/*.tar.gz

  # Create GitHub Release with all artifacts
  release:
    runs-on: ubuntu-latest
    needs: [package, prerelease]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: just-ai*-*
        path: dist/
        merge-multiple: true

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        generate_release_notes: true
        prerelease: ${{ needs.prerelease.outputs.value }}

  # Build and push multi-arch Docker images
  docker:
    runs-on: ubuntu-latest
    needs: [release, prerelease]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker meta (CLI)
      id: meta-cli
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/cli
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push CLI (multi-arch)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.cli
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-cli.outputs.tags }}
        labels: ${{ steps.meta-cli.outputs.labels }}
        provenance: true
        sbom: true

    - name: Docker meta (MCP)
      id: meta-mcp
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/mcp
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push MCP (multi-arch)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.mcp
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-mcp.outputs.tags }}
        labels: ${{ steps.meta-mcp.outputs.labels }}
        provenance: true
        sbom: true

    - name: Docker meta (GUI)
      id: meta-gui
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/gui
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push GUI (multi-arch)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.gui
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-gui.outputs.tags }}
        labels: ${{ steps.meta-gui.outputs.labels }}
        provenance: true
        sbom: true

  # Generate SBOM for the workspace
  sbom:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-sbom
      run: cargo install cargo-sbom

    - name: Generate SBOM
      run: |
        cargo sbom --format spdx-json --output target/sbom.spdx.json

    - name: Upload SBOM to Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/sbom.spdx.json
        prerelease: ${{ needs.prerelease.outputs.value }}

  # SLSA Provenance Generation
  slsa:
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    needs: [release, docker]
    permissions:
      contents: write
      id-token: write
      packages: read
    with:
      provenance-name: slsa-provenance.intoto.jsonl

  # Sign artifacts with cosign (keyless)
  sign:
    runs-on: ubuntu-latest
    needs: [release, docker, sbom, slsa]
    permissions:
      contents: write
      id-token: write
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Install cosign
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.4.0'

    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: just-ai*-*
        path: dist/
        merge-multiple: true

    - name: Sign binaries
      run: |
        cd dist
        for file in *; do
          [[ "$file" == *.sig ]] && continue
          [[ "$file" == *.txt ]] && continue
          cosign sign-blob --yes --bundle "${file}.sig" "${file}"
        done

    - name: Sign SBOM
      run: |
        cosign sign-blob --yes --bundle target/sbom.spdx.json.sig target/sbom.spdx.json

    - name: Sign Docker images
      run: |
        cosign sign --yes \
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/cli:${{ github.ref_name }} \
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/mcp:${{ github.ref_name }} \
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/just-ai/gui:${{ github.ref_name }}

    - name: Upload signatures to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.sig
          target/sbom.spdx.json.sig
        prerelease: ${{ needs.prerelease.outputs.value }}