name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # -------------------------------------------------------------------
  # Code checks
  # -------------------------------------------------------------------
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  # -------------------------------------------------------------------
  # Build CLI binary for all platforms
  # -------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: just-ai-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: just-ai-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: just-ai-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: just-ai-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release --package just-ai --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/just-ai*

  # -------------------------------------------------------------------
  # Build MCP binary for all platforms
  # -------------------------------------------------------------------
  build-mcp:
    name: Build MCP (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: just-ai-mcp-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: just-ai-mcp-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: just-ai-mcp-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: just-ai-mcp-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build MCP
        run: cargo build --release --manifest-path apps/just-ai-mcp/Cargo.toml --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/just-ai-mcp/target/${{ matrix.target }}/release/just-ai-mcp*

  # -------------------------------------------------------------------
  # Docker images
  # -------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cli
          push: false
          load: true
          tags: just-ai/cli:test

      - name: Build MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          load: true
          tags: just-ai/mcp:test

      - name: Test CLI image
        run: |
          docker run --rm just-ai/cli:test --help
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace just-ai/cli:test doctor

      - name: Test MCP image
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | docker run -i just-ai/mcp:test | jq -e '.result == "pong"'

  # -------------------------------------------------------------------
  # Security audit
  # -------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo audit
        run: |
          cargo install cargo-audit
          cargo audit --workspace

      - name: Run cargo deny
        run: |
          cargo install cargo-deny
          cargo deny check advisories licenses bans sources

  # -------------------------------------------------------------------
  # Release on tag
  # -------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, build-cli, build-mcp]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: just-ai-*-x86_64*
          path: dist/

      - name: Download MCP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: just-ai-mcp-*-x86_64*
          path: dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          generate_release_notes: true