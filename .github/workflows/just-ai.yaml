name: just-ai layers

on:
  pull_request:
    paths:
      - "crates/just-ai/**"
      - "apps/just-ai-gui/**"
      - "apps/just-ai-mcp/**"
      - "apps/just-ai-vscode/**"
      - "tests/companion_smoke.py"
      - "crates/just-ai-lsp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "agent/**"
      - "docs/architecture/**"
      - ".github/workflows/just-ai.yaml"
  push:
    branches: [master]
    paths:
      - "crates/just-ai/**"
      - "apps/just-ai-gui/**"
      - "apps/just-ai-mcp/**"
      - "apps/just-ai-vscode/**"
      - "tests/companion_smoke.py"
      - "crates/just-ai-lsp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "agent/**"
      - "docs/architecture/**"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package just-ai --all-targets -- -D warnings
      - run: cargo build --locked --package just --package just-ai --package just-ai-mcp --bins
      - name: Use built upstream runner
        shell: bash
        run: echo "${{ github.workspace }}/target/debug" >> "$GITHUB_PATH"
      - run: cargo test --locked --package just-ai --package just-ai-lsp
      - run: cargo fmt --manifest-path apps/just-ai-mcp/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/just-ai-mcp/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/just-ai-mcp/Cargo.toml --locked
      - run: python tests/companion_smoke.py --bin-dir target/debug

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --package just-ai --all-targets -- -D warnings
      - run: cargo build --locked --package just --package just-ai --package just-ai-mcp --bins
      - name: Use built upstream runner
        shell: bash
        run: echo "${{ github.workspace }}/target/debug" >> "$GITHUB_PATH"
      - run: cargo test --locked --package just-ai --package just-ai-lsp

      - run: python tests/companion_smoke.py --bin-dir target/debug

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/just-ai-gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/just-ai-gui/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/just-ai-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/just-ai-vscode/package-lock.json
      - run: npm ci
      - run: npm run test:contracts
