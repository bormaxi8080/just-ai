name: Release PR

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Repository Settings > Actions > General must allow Actions to create PRs.
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: "release-pr"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TERM_COLOR: always

      - name: Release PR troubleshooting
        if: failure()
        run: |
          echo 'If GitHub returned "Actions is not permitted to create or approve pull requests", enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The workflow already requests contents:write and pull-requests:write; YAML permissions cannot override this repository setting.' >> "$GITHUB_STEP_SUMMARY"
