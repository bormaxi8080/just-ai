# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

# Licenses configuration
[licenses]
# Allow these specific licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
]

# Clarifications for ambiguous licenses
[[licenses.clarify]]
name = "Unlicense"
expression = "Unlicense"
license-files = []

# Advisory database checks
[advisories]
# Ignore specific advisories (unmaintained or no fix available)
ignore = [
    "RUSTSEC-2023-0071", # rsa: no fix available
    "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained
    "RUSTSEC-2026-0204", # crossbeam-epoch: transitive
]

# Bans configuration
[bans]
# Deny specific crates/versions (currently none)
deny = []
# Allow multiple versions of the same crate (for workspace flexibility)
multiple-versions = "allow"
# Skip specific crates when checking for multiple versions
skip = [
    "getrandom",
    "syn",
]