[package]
name = "just-ai"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "just-ai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0.0", features = ["derive", "env"] }
dirs = "6.0.0"
jsonschema = { version = "0.48.0", default-features = false }
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.68"
similar = "3.0.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "json", "chrono", "uuid", "runtime-tokio-native-tls"] }
tempfile = "3.0.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }
toml = "0.8"
ureq = { version = "3.2.0", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
async-stream = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
